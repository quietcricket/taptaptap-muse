[project]
name = "taptaptap-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "boto3>=1.35,<2",
  "email-validator>=2.2,<3",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "moto[dynamodb]>=5,<6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/server"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
