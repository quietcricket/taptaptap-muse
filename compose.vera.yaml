name: taptaptap
services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to the release image URI}
    environment:
      APP_URL: https://taptaptap.birme.net
      EMAIL_DELIVERY: ses
      EMAIL_FROM: ${EMAIL_FROM:?Set a verified SES sender}
      AWS_REGION: ap-southeast-1
      SES_REGION: ${SES_REGION:-us-east-1}
      DYNAMODB_TABLE: taptaptap
      META_API_KEY: ${META_API_KEY:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
    init: true
    read_only: true
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  proxy:
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
